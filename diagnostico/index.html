<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico de vendas para lojas de veículos · LeadVox</title>
<meta name="description" content="Em 2 minutos, descubra em que marcha está a venda da sua loja de carros ou motos e onde os leads estão escapando.">
<meta property="og:title" content="Em que marcha está a sua loja?">
<meta property="og:description" content="Diagnóstico gratuito de vendas para lojas de carros e motos. 11 perguntas, 2 minutos.">
<meta name="theme-color" content="#070d1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#070d1c; --panel:#0d172d; --panel2:#111e3a; --line:#1e2c4d;
  --green:#2be87b; --green-d:#1fb862; --ink:#eef2f8; --muted:#93a0bd;
  --warn:#ff8a5b; --amber:#f5c542;
  --r-lg:22px; --r-md:14px;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--navy);color:var(--ink);
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  background-image:radial-gradient(ellipse 70% 45% at 50% -10%,rgba(43,232,123,.10),transparent 70%);
  background-repeat:no-repeat}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;justify-content:space-between;height:56px;margin-bottom:8px}
.brand .logo{height:51px;width:auto;display:block}
.brand a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--green);color:var(--navy);
  font-family:'Syne',sans-serif;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.brand .word{font-family:'Syne',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.2px}
.brand .back{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.brand .back[hidden]{display:none}
.screen{flex:1;display:flex;flex-direction:column}
.screen[hidden]{display:none}
.anim{animation:enter .32s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim{animation:none}*{transition:none!important}}

/* intro */
.intro{padding-top:6vh}
.intro h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(38px,10vw,58px);line-height:1.02;letter-spacing:-1.5px;margin:18px 0 18px}
.intro p.lead{font-size:18px;color:#c6cfe2;margin:0 0 28px;max-width:30em}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;padding:0;list-style:none}
.facts li{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:#c6cfe2;background:var(--panel)}
.gear{display:block;width:108px;height:108px}
.btn{appearance:none;border:0;text-decoration:none;border-radius:var(--r-md);background:var(--green);color:var(--navy);
  font-weight:700;font-size:17px;padding:17px 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s ease,background .15s ease;min-height:56px}
.btn:hover{background:#4af18f}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--panel)}
.btn[disabled]{opacity:.55;cursor:default}
.fine{font-size:13px;color:var(--muted);margin-top:14px}

/* progress track */
.track{position:relative;height:34px;margin:6px 0 26px}
.track .road{position:absolute;left:0;right:22px;top:21px;height:3px;border-radius:3px;background:var(--line)}
.track .done{position:absolute;left:0;top:21px;height:3px;border-radius:3px;background:var(--green);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.track .car{position:absolute;top:0;width:34px;height:22px;margin-left:-17px;transition:left .45s cubic-bezier(.3,.8,.3,1)}
.track .flag{position:absolute;right:0;top:6px;width:18px;height:20px}
.count{font-size:14px;color:var(--muted);margin:0 0 8px}
.q{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(25px,6.4vw,33px);line-height:1.15;letter-spacing:-.5px;margin:0 0 8px}
.qhint{color:var(--muted);font-size:15px;margin:0 0 22px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r-md);padding:15px 16px;min-height:62px;
  font-size:16.5px;line-height:1.35;transition:border-color .15s ease,background .15s ease,transform .1s ease}
.opt:hover{border-color:#34508a;background:var(--panel2)}
.opt:active{transform:scale(.99)}
.opt .k{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--muted);transition:all .15s ease}
.opt.sel{border-color:var(--green);background:rgba(43,232,123,.08)}
.opt.sel .k{background:var(--green);border-color:var(--green);color:var(--navy)}

/* gate */
.gate h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,7vw,38px);line-height:1.08;letter-spacing:-.8px;margin:8px 0 10px}
.gate p{color:#c6cfe2;margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:500;color:#c6cfe2}
.field input{appearance:none;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);
  font:inherit;font-size:16.5px;padding:14px 14px;min-height:52px;transition:border-color .15s ease}
.field input:focus{outline:none;border-color:var(--green)}
.field input[aria-invalid="true"]{border-color:var(--warn)}
.field .err{font-size:13px;color:var(--warn);min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#c6cfe2;margin:6px 0 20px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green);margin:1px 0 0;flex-shrink:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* result */
.res-top{text-align:center;padding-top:4px}
.tach{width:min(320px,86vw);height:auto;display:block;margin:0 auto}
.res-label{font-size:15px;color:var(--muted);margin:14px 0 4px}
.res-level{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(34px,9vw,48px);line-height:1;letter-spacing:-1px;margin:0 0 10px}
.res-desc{font-size:17px;color:#c6cfe2;max-width:28em;margin:0 auto 30px}
.block{margin-bottom:30px}
.block h3{font-family:'Syne',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.3px;margin:0 0 14px}
.gaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.gaps li{display:flex;gap:12px;font-size:15.5px;color:#d7deec;line-height:1.45}
.gaps li::before{content:'';flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:8px}
.sols{display:flex;flex-direction:column;gap:10px}
.sol{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:12px;padding:14px 16px}
.sol b{display:block;font-size:16.5px;margin-bottom:3px}
.sol span{font-size:15px;color:#b9c3d8;line-height:1.45}
.sent{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;gap:12px;align-items:flex-start;font-size:15px;color:#c6cfe2;margin-bottom:16px}
.sent svg{flex-shrink:0;margin-top:2px}
.sent.fail{border-color:rgba(255,138,91,.5)}
.sent .retry{background:none;border:0;color:var(--green);font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-direction:column;gap:10px}
.loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;color:#c6cfe2}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.foot{margin-top:auto;padding-top:26px;text-align:center;font-size:12.5px;color:#66739a}
.foot a{color:#8c98b3}
</style>
</head>
