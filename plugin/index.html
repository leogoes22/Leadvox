<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proposta LeadVox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js"></script>
<style>
:root{
  --navy:#070d1c; --panel:#0d1528; --panel2:#121c33; --line:#1e2a45; --line2:#2a3858;
  --txt:#e8ecf5; --muted:#8a94ad; --green:#2be87b; --green-dim:rgba(43,232,123,.12); --red:#ff6b7a;
  --r-sm:8px; --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--txt);font:14px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* topo */
.top{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font:700 15px "Syne",sans-serif;letter-spacing:-.01em}
.brand b{color:var(--green)}
.num{font-size:11px;color:var(--muted)}
.who{margin-top:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who strong{color:var(--txt);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:12px}
.step{padding:7px 1px 6px;border-radius:var(--r-sm);font-size:10.5px;color:var(--muted);text-align:center;border:1px solid transparent;line-height:1.2}
.step i{display:block;font:700 12px "Syne",sans-serif;font-style:normal;margin-bottom:2px}
.step.on{background:var(--panel2);border-color:var(--line2);color:var(--txt)}
.step.on i{color:var(--green)}
.step.ok i{color:var(--green)}

/* corpo */
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h2{font:700 19px/1.2 "Syne",sans-serif;letter-spacing:-.01em;margin-bottom:4px}
.lead{color:var(--muted);font-size:13px;margin-bottom:16px}
.grp{margin-bottom:18px}
.grp-t{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input.i,select.i,textarea.i{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;outline:0;transition:border-color .15s}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--green)}
textarea.i{resize:vertical;min-height:70px;line-height:1.4}
select.i{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.ia-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 2px;margin-bottom:12px}
.ia-box h3{font:700 13px "Syne",sans-serif;margin-bottom:10px;color:var(--green)}
.ia-sub{font-size:11.5px;color:var(--muted);margin:2px 0 8px}
.btn-ia{width:100%;padding:12px;border-radius:var(--r-sm);background:var(--green);color:var(--navy);font-weight:600;margin-bottom:16px}
.btn-ia:disabled{opacity:.55;cursor:wait}
.warn{font-size:12px;color:#ffc36b;background:rgba(255,195,107,.08);border-left:2px solid #ffc36b;padding:8px 10px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-bottom:14px}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden;flex:none}
.seg button{padding:9px 12px;font-size:13px;color:var(--muted);background:var(--panel)}
.seg button.on{background:var(--green);color:var(--navy);font-weight:600}
.desc-row{display:flex;gap:8px;align-items:stretch}
.desc-row input{flex:1;min-width:0}
.res{background:var(--panel2);border:1px solid var(--green);border-radius:var(--r);padding:12px 14px;margin:4px 0 18px;font-size:13px;line-height:1.5}
.res b{color:var(--green)}
.res p+p{margin-top:6px}
.grp-t b{color:var(--txt)}
.hint{font-size:12px;color:var(--muted);background:var(--panel);border-left:2px solid var(--green);padding:8px 10px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-bottom:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted);background:transparent;text-align:left}
.chip.on{background:var(--green-dim);border-color:var(--green);color:var(--txt)}
.add-row{display:flex;gap:6px;margin-top:8px}
.add-row input{flex:1}
.btn-sm{padding:8px 12px;border-radius:var(--r-sm);background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;white-space:nowrap}

/* serviços */
.svc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--panel);overflow:hidden}
.svc.on{border-color:var(--green)}
.svc-h{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 12px;text-align:left}
.tick{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);margin-top:1px;display:grid;place-items:center}
.svc.on .tick{background:var(--green);border-color:var(--green)}
.svc.on .tick::after{content:"";width:8px;height:4px;border:2px solid var(--navy);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.svc-n,.svc-d,.svc-p{display:block}
.svc-n{font-weight:600;font-size:13.5px}
.svc-d{font-size:12px;color:var(--muted);margin-top:1px}
.svc-p{font-size:12px;margin-top:5px;color:var(--muted)}
.svc-p b{color:var(--txt);font-weight:600}
.svc-x{display:none;grid-template-columns:70px 1fr 1fr;gap:8px;padding:0 12px 12px 40px}
.svc.on .svc-x{display:grid}
.svc-x label span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.svc-x input{width:100%;background:var(--navy);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;outline:0}
.svc-x input:focus{border-color:var(--green)}
.rm{font-size:12px;color:var(--red);padding:0 12px 10px 40px;display:block}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw small{display:block;color:var(--muted);font-size:12px}
.tg{flex:none;width:38px;height:22px;border-radius:99px;background:var(--line2);position:relative;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--green)}
.tg.on::after{transform:translateX(16px)}

/* resumo */
.sum{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.sum-e{font:700 16px/1.25 "Syne",sans-serif}
.sum-l{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--muted)}
.sum-l b{color:var(--txt);font-weight:600}
.sum-items{font-size:12.5px;color:var(--muted);margin:8px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn-sec{padding:10px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--panel2);font-weight:500;font-size:13px}
.done{text-align:center;padding:26px 8px}
.done-c{width:54px;height:54px;border-radius:50%;background:var(--green-dim);border:1.5px solid var(--green);margin:0 auto 14px;display:grid;place-items:center}
.done-c::after{content:"";width:18px;height:9px;border:3px solid var(--green);border-top:0;border-right:0;transform:rotate(-45deg) translate(2px,-2px)}
.done p{color:var(--muted);font-size:13px;margin:6px 0 16px}
.done a{color:var(--green)}
.status-list{text-align:left;font-size:12.5px;background:var(--panel);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:16px}
.status-list div{padding:3px 0}
.status-list .ok{color:var(--green)} .status-list .no{color:var(--red)}

/* barra inferior */
.bar{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:10px 16px 12px;display:flex;align-items:center;gap:12px}
.tot{flex:1;min-width:0}
.tot-l{font-size:11px;color:var(--muted)}
.tot-v{font:700 20px/1.1 "Syne",sans-serif;color:var(--green);letter-spacing:-.01em;transition:transform .2s}
.tot-v.bump{transform:scale(1.05)}
.tot-m{font-size:11.5px;color:var(--muted)}
.tot-m b{color:var(--txt);font-weight:600}
.back{padding:11px 12px;border-radius:var(--r-sm);color:var(--muted);font-size:13px}
.go{padding:11px 16px;border-radius:var(--r-sm);background:var(--green);color:var(--navy);font-weight:600;font-size:13.5px;white-space:nowrap}
.go:disabled{opacity:.5;cursor:wait}

/* modal e aviso */
.modal{position:fixed;inset:0;background:rgba(3,6,14,.88);display:none;flex-direction:column;padding:12px;z-index:20}
.modal.on{display:flex}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:0 2px 10px;gap:8px}
.modal iframe{flex:1;border:0;border-radius:var(--r-sm);background:#fff;width:100%}
.toast{white-space:pre-line;max-height:60vh;overflow:auto;position:fixed;left:12px;right:12px;bottom:84px;background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--red);padding:10px 12px;border-radius:var(--r-sm);font-size:13px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast.good{border-left-color:var(--green)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:8px;color:var(--muted)}
.center h2{color:var(--txt)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:400px){.bar{gap:8px;padding:10px 12px 12px}.tot-v{font-size:17px}.back{padding:11px 8px}.back .bk-t{display:none}.back::before{content:"←";font-size:16px}.go{padding:11px 12px;font-size:13px}}
</style>
</head>
<body>
<div id="app" style="display:contents"></div>
<div class="modal" id="modal" role="dialog" aria-label="Prévia do PDF">
  <div class="modal-h">
    <strong>Prévia da proposta</strong>
    <span style="display:flex;gap:6px">
      <button class="btn-sm" id="mDown">Baixar PDF</button>
      <button class="btn-sm" id="mClose">Fechar</button>
    </span>
  </div>
  <iframe id="mFrame" title="Prévia do PDF"></iframe>
</div>
<div class="toast" id="toast" role="status"></div>

function campoPersonalizado(contact, nomes) {
  var cf = contact && (contact.customFields || contact.extraInfo);
  if (!cf) return '';
  var norm = function (s) { return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); };
  var alvos = nomes.map(norm);
  if (Array.isArray(cf)) { for (var i = 0; i < cf.length; i++) { var it = cf[i] || {}; if (alvos.indexOf(norm(it.name || it.key || '')) > -1 && it.value) return String(it.value); } return ''; }
  for (var k in cf) if (alvos.indexOf(norm(k)) > -1 && cf[k]) return String(cf[k]);
  return '';
}
function aplicarTicket(t) {
  if (!t || !t.id) return;
  if (S.ticket && S.ticket.id === t.id) { S.ticket = t; return; }
  S.ticket = t;
  var r = lerRascunho();
  if (r && r.p) { S.p = r.p; S.passo = r.passo || 0; S.enviado = null; render(); return; }
  S.p = novaProposta(); S.passo = 0; S.enviado = null;
  var c = t.contact || {}, cl = S.p.cliente;
  cl.responsavel = c.name || '';
  cl.whatsapp = telBonito(c.number || '');
  cl.email = c.email || campoPersonalizado(c, ['E-mail:', 'email']);
  cl.empresa = campoPersonalizado(c, ['Nome Empresa.:', 'Empresa', 'Nome Empresa']) || c.company || '';
  cl.cargo = campoPersonalizado(c, ['Função:', 'Cargo']);
  cl.segmento = campoPersonalizado(c, ['Segmento', 'Nicho:', 'Setor de Atuação:']);
  cl.cidade = campoPersonalizado(c, ['Praça/UF', 'Cidade']) || [c.cidade, c.estado].filter(Boolean).join(' / ');
  render();
}
window.addEventListener('message', function (ev) {
  if (CFG.ORIGENS.indexOf(ev.origin) === -1) return;
  var m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
  if (m && m.type === 'DEFAULT_DATA' && m.data && m.data.ticket) aplicarTicket(m.data.ticket);
});

var app = document.getElementById('app');

function render() {
  if (!CFG.KEY) { app.innerHTML = '<div class="center"><h2>Falta a chave de acesso</h2><p>Abra o plugin pela URL completa cadastrada na LeadVox, com <b>?k=</b> no final.</p></div>'; return; }
  if (S.carregando) { app.innerHTML = '<div class="center"><p>Carregando a tabela de serviços…</p></div>'; return; }
  if (S.erro) { app.innerHTML = '<div class="center"><h2>Não deu pra abrir</h2><p>' + esc(S.erro) + '</p><button class="btn-sm" onclick="carregarCatalogo()">Tentar de novo</button></div>'; return; }

  var cl = S.p.cliente;
  var quem = cl.empresa || cl.responsavel ? '<strong>' + esc(cl.empresa || cl.responsavel) + '</strong>' + (cl.empresa && cl.responsavel ? ' · ' + esc(cl.responsavel) : '') : 'Nenhum cliente carregado do ticket';
  var passos = PASSOS.map(function (n, i) {
    return '<button class="step' + (i === S.passo ? ' on' : '') + (i < S.passo ? ' ok' : '') + '" data-passo="' + i + '"><i>' + (i + 1) + '</i>' + n + '</button>';
  }).join('');

  app.innerHTML =
    '<header class="top"><div class="top-row"><span class="brand">Lead<b>Vox</b> proposta</span><span class="num">' + esc(S.p.numero) + '</span></div>' +
    '<div class="who">' + quem + '</div><nav class="steps">' + passos + '</nav></header>' +
    '<main id="main">' + (S.enviado ? telaEnviado() : [telaCliente, telaCenario, telaServicos, telaCondicoes, telaTexto, telaEnviar][S.passo]()) + '</main>' +
    (S.enviado ? '' : barra());
  ligar();
  atualizarTotais();
}

function campo(rot, path, extra) {
  extra = extra || {};
  var v = get(S.p, path);
  var tag = extra.area ? '<textarea class="i" data-k="' + path + '" rows="' + (extra.rows || 3) + '" placeholder="' + esc(extra.ph || '') + '">' + esc(v) + '</textarea>'
    : '<input class="i" data-k="' + path + '" value="' + esc(v) + '" placeholder="' + esc(extra.ph || '') + '"' + (extra.list ? ' list="' + extra.list + '"' : '') + (extra.type ? ' type="' + extra.type + '" inputmode="' + (extra.im || '') + '"' : '') + '>';
  return '<label class="f"><span>' + rot + '</span>' + tag + '</label>';
}
function chips(lista, path) {
  var sel = get(S.p, path) || [];
  var todos = lista.concat(sel.filter(function (x) { return lista.indexOf(x) === -1; }));
  return '<div class="chips">' + todos.map(function (x) { return '<button class="chip' + (sel.indexOf(x) > -1 ? ' on' : '') + '" data-chip="' + path + '" data-v="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>';
}
function toggle(rot, sub, path) {
  return '<div class="sw"><div>' + rot + (sub ? '<small>' + sub + '</small>' : '') + '</div><button class="tg' + (get(S.p, path) ? ' on' : '') + '" data-tg="' + path + '" role="switch" aria-checked="' + !!get(S.p, path) + '" aria-label="' + esc(rot) + '"></button></div>';
}
function selecao(rot, path, ops) {
  var v = String(get(S.p, path));
  return '<label class="f"><span>' + rot + '</span><select class="i" data-k="' + path + '">' + ops.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></label>';
}

function gerarIA() {
  if (!itensProposta().length) { irPara(2); return aviso('Marque os serviços antes de gerar o texto.'); }
  S.gerando = true; rerender();
  var cl = S.p.cliente, c = S.p.cenario;
  api({
    rota: 'gerar', instrucoes: S.p.instrucoes, unidades: S.p.unidades,
    cliente: { empresa: cl.empresa, segmento: cl.segmento, cidade: cl.cidade, responsavel: cl.responsavel, cargo: cl.cargo },
    cenario: { equipe: c.equipe, leadsMes: c.leadsMes, canais: c.canais, dores: c.desafios, comoEHoje: c.atual, objetivo: c.objetivo, usaApiNaoOficial: !!c.usaQR },
    servicos: itensProposta().map(function (i) { return { id: i.id, nome: i.nome, descricao: i.descricao, qtd: i.qtd }; })
  }).then(function (j) {
    S.gerando = false;
    if (!j.ok) { rerender(); return aviso(j.erro || 'A IA não respondeu. Tente de novo.'); }
    S.p.ia = j.ia; S.p.iaIds = idsAtuais(); salvarRascunho(); rerender(); aviso('Texto pronto. Revise e ajuste o que quiser.', true);
  }).catch(function () { S.gerando = false; rerender(); aviso('Sem conexão com o servidor do plugin.'); });
}

    '<div class="grp">' + toggle('Registrar oportunidade no funil', 'Etapa “Call de Apresentação / Proposta”, com o valor do contrato', 'oportunidade') + '</div>';
}
function telaEnviado() {
  var e = S.enviado;
  var st = (e.status || []).map(function (s) { return '<div class="' + (s.ok ? 'ok' : 'no') + '">' + (s.ok ? '✓ ' : '✕ ') + esc(s.texto) + '</div>'; }).join('');
  return '<div class="done"><div class="done-c"></div><h2>Proposta enviada</h2><p>' + esc(e.numero) + ' foi para ' + esc(telBonito(e.telefone)) + '.</p>' +
    (st ? '<div class="status-list">' + st + '</div>' : '') +
    (e.pdfUrl ? '<p><a href="' + esc(e.pdfUrl) + '" target="_blank" rel="noopener">Abrir o PDF enviado</a></p>' : '') +
    '<button class="go" id="nova">Começar nova proposta</button></div>';
}
function barra() {
  var ult = S.passo === PASSOS.length - 1;
  return '<footer class="bar"><div class="tot"><div class="tot-l">Pagamento inicial</div><div class="tot-v" id="tv">R$ 0,00</div><div class="tot-m" id="tm"></div></div>' +
    (S.passo > 0 ? '<button class="back" id="voltar" aria-label="Voltar"><span class="bk-t">Voltar</span></button>' : '') +
    '<button class="go" id="avancar">' + (ult ? 'Enviar proposta' : 'Continuar') + '</button></footer>';
}
var ultimoTotal = null;
function atualizarTotais() {
  var tv = document.getElementById('tv'), tm = document.getElementById('tm'); if (!tv) return;
  var t = totais();
  tv.textContent = brl(t.inicial);
  tm.innerHTML = 'Mensal <b>' + brl(t.mensalTotal) + '</b>';
  if (ultimoTotal !== null && ultimoTotal !== t.inicial) { tv.classList.remove('bump'); void tv.offsetWidth; tv.classList.add('bump'); setTimeout(function () { tv.classList.remove('bump'); }, 200); }
  ultimoTotal = t.inicial;
  var rc = document.getElementById('resCond'); if (rc) rc.innerHTML = resumoHTML();
}

/* ================= EVENTOS ================= */
function ligar() {
  app.querySelectorAll('[data-passo]').forEach(function (b) { b.onclick = function () { irPara(+b.dataset.passo); }; });
  app.querySelectorAll('[data-k]').forEach(function (el) {
    el.oninput = el.onchange = function () {
      var k = el.dataset.k, v = el.value;
      if (/Pct$/.test(k) || /\.v$/.test(k)) v = num(v);
      if (k === 'unidades') v = Math.max(1, parseInt(v, 10) || 1);
      set(S.p, k, v); salvarRascunho(); atualizarTotais();
      if (k === 'desc.meses' && el.tagName === 'SELECT') return rerender();
      if (k === 'cliente.empresa' || k === 'cliente.responsavel') { var w = document.querySelector('.who'); if (w) w.innerHTML = '<strong>' + esc(S.p.cliente.empresa || S.p.cliente.responsavel) + '</strong>'; }
    };
  });
  app.querySelectorAll('[data-chip]').forEach(function (b) {
    b.onclick = function () {
      var arr = get(S.p, b.dataset.chip), v = b.dataset.v, i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); else arr.push(v); b.classList.toggle('on');
      if (v === QR) { S.p.cenario.usaQR = arr.indexOf(QR) > -1; salvarRascunho(); return rerender(); }
      salvarRascunho();
    };
  });
  app.querySelectorAll('[data-tg]').forEach(function (b) {
    b.onclick = function () { var k = b.dataset.tg; set(S.p, k, !get(S.p, k)); salvarRascunho(); if (k === 'cenario.usaQR') { var cs = S.p.cenario.canais, q = cs.indexOf(QR); if (S.p.cenario.usaQR && q === -1) cs.push(QR); if (!S.p.cenario.usaQR && q > -1) cs.splice(q, 1); salvarRascunho(); rerender(); }
      else if (k === 'desc.isentarImpl' || k === 'enviarEmail') rerender(); else { b.classList.toggle('on'); b.setAttribute('aria-checked', !!get(S.p, k)); atualizarTotais(); } };
  });
  app.querySelectorAll('[data-svc]').forEach(function (b) {
    b.onclick = function () {
      var id = b.dataset.svc, c = S.cat.find(function (x) { return x.id === id; });
      if (S.p.sel[id]) delete S.p.sel[id];
      else {
        if (c.exclusivo) S.cat.forEach(function (o) { if (o.id !== id && o.exclusivo === c.exclusivo) delete S.p.sel[o.id]; });
        S.p.sel[id] = { qtd: 1, impl: c.impl, mensal: c.mensal };
      }
      salvarRascunho(); rerender();
    };
  });
  app.querySelectorAll('[data-sv]').forEach(function (el) {
    el.oninput = function () { var s = S.p.sel[el.dataset.sv]; if (!s) return; s[el.dataset.f] = el.dataset.f === 'qtd' ? Math.max(1, parseInt(el.value, 10) || 1) : num(el.value); salvarRascunho(); atualizarTotais(); };
  });
  app.querySelectorAll('[data-av]').forEach(function (el) {
    el.oninput = function () { var a = S.p.avulsos[+el.dataset.av], f = el.dataset.f; a[f] = f === 'nome' || f === 'descricao' ? el.value : (f === 'qtd' ? Math.max(1, parseInt(el.value, 10) || 1) : num(el.value)); salvarRascunho(); atualizarTotais(); };
  });
  app.querySelectorAll('[data-rmav]').forEach(function (b) { b.onclick = function () { S.p.avulsos.splice(+b.dataset.rmav, 1); salvarRascunho(); rerender(); }; });
  on('addAv', function () { S.p.avulsos.push({ id: 'av' + Date.now(), nome: '', descricao: '', qtd: 1, impl: 0, mensal: 0 }); salvarRascunho(); rerender(); });
  on('addDor', function () { var i = document.getElementById('novaDor'), v = i.value.trim(); if (!v) return; if (S.p.cenario.desafios.indexOf(v) === -1) S.p.cenario.desafios.push(v); salvarRascunho(); rerender(); });
  on('addCanal', function () { var i = document.getElementById('novoCanal'), v = i.value.trim(); if (!v) return; if (S.p.cenario.canais.indexOf(v) === -1) S.p.cenario.canais.push(v); salvarRascunho(); rerender(); });
  var nc = document.getElementById('novoCanal'); if (nc) nc.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('addCanal').click(); };
  var nd = document.getElementById('novaDor'); if (nd) nd.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('addDor').click(); };
  on('voltar', function () { irPara(S.passo - 1); });
  on('avancar', function () { if (S.passo < PASSOS.length - 1) irPara(S.passo + 1); else enviar(); });
  app.querySelectorAll('[data-modo]').forEach(function (b) { b.onclick = function (ev) { ev.preventDefault(); set(S.p, b.dataset.modo + '.modo', b.dataset.v); salvarRascunho(); rerender(); }; });
  on('prev', previa); on('down', baixar); on('gerarIA', gerarIA);
  app.querySelectorAll('[data-linhas]').forEach(function (el) { el.oninput = function () { set(S.p, el.dataset.linhas, el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean)); salvarRascunho(); }; });
  on('nova', function () { apagarRascunho(); S.p = novaProposta(); S.enviado = null; S.passo = 0; if (S.ticket) { var t = S.ticket; S.ticket = null; aplicarTicket(t); } else render(); });
}
function on(id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; }
function rerender() { var m = document.getElementById('main'), y = m ? m.scrollTop : 0; render(); var m2 = document.getElementById('main'); if (m2) m2.scrollTop = y; }
function irPara(i) { S.passo = Math.max(0, Math.min(PASSOS.length - 1, i)); salvarRascunho(); render(); document.getElementById('main').scrollTop = 0; }

/* ================= PDF ================= */
function doc(cb) { fontes.then(function () { cb(pdfMake.createPdf(montarProposta(dadosPDF(), { empresa: S.empresa, logo: LOGO, logoPequena: LOGO_P }))); }); }
function nomeArquivo() {
  var base = (S.p.cliente.empresa || S.p.cliente.responsavel || 'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return 'Proposta-LeadVox-' + base + '-' + S.p.numero + '.pdf';
}
var blobUrl = null;
function previa() {
  if (!itensProposta().length) return aviso('Marque pelo menos um serviço antes de gerar o PDF.');
  doc(function (d) { d.getBlob(function (b) {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl = URL.createObjectURL(b);
    document.getElementById('mFrame').src = blobUrl;
    document.getElementById('modal').classList.add('on');
  }); });
}
function baixar() {
  if (!itensProposta().length) return aviso('Marque pelo menos um serviço antes de gerar o PDF.');
  doc(function (d) { d.download(nomeArquivo()); });
}
document.getElementById('mClose').onclick = function () { document.getElementById('modal').classList.remove('on'); };
document.getElementById('mDown').onclick = baixar;

function validar() {
  var cl = S.p.cliente;
  if (!cl.empresa && !cl.responsavel) return { passo: 0, msg: 'Preencha a empresa ou o nome do responsável.' };
  var tel = telefoneEnvio(cl.whatsapp);
  if (tel.length < 12 || tel.length > 13) return { passo: 5, msg: 'O WhatsApp de envio parece incompleto. Use DDD + número.' };
  if (!itensProposta().length) return { passo: 2, msg: 'Marque pelo menos um serviço.' };
  if (S.p.enviarEmail && String(cl.email || '').trim() && !emailValido(cl.email)) return { passo: 5, msg: 'O e-mail do cliente parece incompleto. Corrija ou deixe em branco.' };
  return null;
}
function enviar() {
  var v = validar();
  if (v) { if (v.passo !== S.passo) irPara(v.passo); return aviso(v.msg); }
  var btn = document.getElementById('avancar'); btn.disabled = true; btn.textContent = 'Gerando PDF…';
  var t = totais(), cl = S.p.cliente, tk = S.ticket || {};
  doc(function (d) { d.getBase64(function (b64) {
    btn.textContent = 'Enviando…';
    var itens = itensProposta();
    api({
      rota: 'enviar',
      numero: S.p.numero, fileName: nomeArquivo(), pdfBase64: b64,
      telefone: telefoneEnvio(cl.whatsapp), mensagem: S.p.mensagem,
      ticketId: tk.id || null, contactId: (tk.contact && tk.contact.id) || tk.contactId || null,
      atendente: (tk.user && tk.user.name) || '',
      empresa: cl.empresa, responsavel: cl.responsavel, unidades: t.u,
      implantacao: t.implTotal, mensal: t.mensalRen, inicial: t.inicial, meses: t.meses, valorContrato: t.contrato,
      mesesAntecipados: t.N, condicao: resumoCondicao(t),
      itens: itens.map(function (i) { return (i.qtd > 1 ? i.qtd + '× ' : '') + i.nome; }),
      criarOportunidade: !!S.p.oportunidade,
      enviarEmail: !!(S.p.enviarEmail && emailValido(cl.email)), email: String(cl.email || '').trim(),
      assunto: S.p.assunto || assuntoPadrao(), validadeDias: S.p.validadeDias,
      resumoIA: (S.p.ia && S.p.ia.capa && S.p.ia.capa.subtitulo) || ''
    }).then(function (j) {
      if (!j.ok) {
        btn.disabled = false; btn.textContent = 'Enviar proposta';
        var det = (j.status || []).map(function (x) { return (x.ok ? '✓ ' : '✕ ') + x.texto; }).join('\n');
        return aviso((j.erro || 'O envio falhou. Nada foi mandado ao cliente.') + (det ? '\n\n' + det : ''), false, 14000);
      }
      apagarRascunho();
      S.enviado = { numero: S.p.numero, telefone: telefoneEnvio(cl.whatsapp), pdfUrl: j.pdfUrl, status: j.status };
      render();
    }).catch(function () { btn.disabled = false; btn.textContent = 'Enviar proposta'; aviso('Sem conexão com o servidor. A proposta não foi enviada.'); });
  }); });
}

var tt;
function aviso(msg, bom, ms) {
  var el = document.getElementById('toast'); el.textContent = msg; el.className = 'toast on' + (bom ? ' good' : '');
  clearTimeout(tt); tt = setTimeout(function () { el.className = 'toast'; }, ms || 4200);
}

render();
if (CFG.KEY) carregarCatalogo();
setTimeout(function () { if (!S.ticket && !S.carregando) { var r = lerRascunho(); if (r && r.p) { S.p = r.p; S.passo = r.passo || 0; render(); } } }, 1800);
</script>
</body>
</html>
