<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ficha de Implantação LeadVox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral com as fichas e as 11 etapas (vira coluna única no celular); à direita, a etapa aberta com os campos e, em cada bloco, para onde a resposta vai (CRM ou IA). */
:root {
  --bg: #f3f6f4; --surface: #ffffff; --sunk: #eaf0ec; --ink: #13201a; --muted: #5b6b63; --line: #d6e0da;
  --accent: #0f9d58; --accent-ink: #ffffff; --accent-soft: #dcf3e6; --crm: #2563c9; --crm-soft: #e3ecfb; --ia: #7a3fd0; --ia-soft: #efe6fb;
  --warn: #9a5b00; --warn-soft: #fff1d6; --bad: #b42318;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1512; --surface: #14201b; --sunk: #0f1a16; --ink: #e5efe9; --muted: #93a69c; --line: #26362f;
  --accent: #2be87b; --accent-ink: #062113; --accent-soft: #123526; --crm: #7fb0ff; --crm-soft: #172741; --ia: #c3a1ff; --ia-soft: #2a1d41;
  --warn: #f2c063; --warn-soft: #33270f; --bad: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1512; --surface: #14201b; --sunk: #0f1a16; --ink: #e5efe9; --muted: #93a69c; --line: #26362f;
  --accent: #2be87b; --accent-ink: #062113; --accent-soft: #123526; --crm: #7fb0ff; --crm-soft: #172741; --ia: #c3a1ff; --ia-soft: #2a1d41;
  --warn: #f2c063; --warn-soft: #33270f; --bad: #ff8a80; color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.contato { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: grid; gap: 2px; }
.contato b { overflow-wrap: anywhere; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; max-width: 1240px; margin: 0 auto; padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 20px; }
h2 { font-size: 24px; }
h3 { font-size: 15px; }
.lado { display: grid; gap: 14px; align-content: start; }
.marca { display: grid; gap: 4px; }
.marca small { color: var(--muted); }
.caixa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.rot { font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.bt { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.bt:hover { border-color: var(--accent); }
.bt.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bt.perigo { color: var(--bad); }
.bt.mini { padding: 4px 9px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fichas { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
.ficha { text-align: left; border: 1px solid transparent; background: var(--sunk); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.ficha[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ficha b { font-weight: 600; overflow-wrap: anywhere; }
.ficha small { color: var(--muted); font-size: 12px; }
.chip { display: inline-block; font: 700 11px/1 var(--body); padding: 4px 7px; border-radius: 99px; letter-spacing: 0.04em; }
.chip.rascunho { background: var(--warn-soft); color: var(--warn); }
.chip.pronta { background: var(--accent-soft); color: var(--accent); }
.chip.crm { background: var(--crm-soft); color: var(--crm); }
.chip.ia { background: var(--ia-soft); color: var(--ia); }
.etapas { display: grid; gap: 2px; list-style: none; margin: 0; padding: 0; }
.etapas button { width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.etapas button:hover { background: var(--sunk); }
.etapas button[aria-current="true"] { background: var(--accent-soft); }
.etapas .n { font: 500 12px/1 var(--mono); color: var(--muted); }
.etapas .pct { font: 500 12px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.etapas .pct.cheio { color: var(--accent); }
main { display: grid; gap: 16px; align-content: start; min-width: 0; }
.topo { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; justify-content: space-between; }
.topo .tit { display: grid; gap: 6px; min-width: 0; }
.topo p { margin: 0; color: var(--muted); max-width: 70ch; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.bloco-cab { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.bloco-cab p { margin: 0; color: var(--muted); font-size: 13.5px; flex-basis: 100%; }
.grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.campo { display: grid; gap: 5px; min-width: 0; }
.campo.largo { grid-column: 1 / -1; }
.campo label, .campo .lbl { font-weight: 600; font-size: 13.5px; }
.campo small { color: var(--muted); font-size: 12.5px; }
input[type=text], input[type=date], input[type=time], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 8px 10px; }
textarea { resize: vertical; min-height: 70px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; }
.linhas { display: grid; gap: 10px; }
.linha { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--sunk); }
.linha .grade { gap: 10px 12px; }
.linha input[type=text], .linha select, .linha textarea { background: var(--surface); }
.linha-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linha-cab span { font: 500 12px/1 var(--mono); color: var(--muted); }
.horario { display: grid; gap: 6px; }
.dia { display: grid; grid-template-columns: 110px 90px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; }
.vazio { text-align: center; padding: 48px 20px; display: grid; gap: 12px; justify-items: center; }
.vazio p { margin: 0; color: var(--muted); max-width: 52ch; }
.aviso { border-radius: 10px; padding: 10px 12px; font-size: 13.5px; background: var(--warn-soft); color: var(--warn); }
.ok { color: var(--accent); }
.estado { font-size: 13px; color: var(--muted); }
.json { width: 100%; min-height: 220px; font: 500 12px/1.45 var(--mono); }
.confirma { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; }
.navega { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .etapas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .grade { grid-template-columns: 1fr; }
  .etapas { grid-template-columns: 1fr; }
  .dia { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .bt, .ficha, .etapas button { transition: background .15s, border-color .15s; } }
</style>
</head>
<body>
<div class="app">
  <aside class="lado">
    <div class="marca">
      <span class="rot">LeadVox · implantação</span>
      <h1>Ficha de implantação</h1>
      <small>Uma ficha por cliente. Preencha na entrevista; depois gere o arquivo do CRM e peça ao Claude: "monta a ficha da &lt;empresa&gt;".</small>
    </div>
    <div class="contato" id="contatoConversa" hidden></div>
    <div class="caixa">
      <div class="bloco-cab"><span class="rot">Fichas</span><button class="bt mini pri" id="novaFicha" type="button">+ Nova ficha</button></div>
      <div class="fichas" id="listaFichas"><p class="estado">Carregando as fichas…</p></div>
    </div>
    <nav class="caixa" aria-label="Etapas da ficha">
      <span class="rot">Etapas</span>
      <ol class="etapas" id="listaEtapas"></ol>
    </nav>
  </aside>
  <main id="principal">
    <div class="caixa vazio"><p class="estado">Carregando…</p></div>
  </main>
</div>

}

  $('#principal').innerHTML = '<div class="caixa vazio"><p class="estado">Abrindo a ficha…</p></div>';
  try { const j = await api('abrir', { id }); if (!j.ficha) { atualId = null; ficha = null; desenharTudo(); return; }
    ficha = j.ficha; ficha.dados = ficha.dados || {}; }
  catch (e) { $('#principal').innerHTML = '<div class="caixa vazio"><p class="aviso">Não deu para abrir a ficha (' + esc(e.code || 'erro') + ').</p></div>'; return; }
  etapaId = 'empresa'; desenharTudo(); try { localStorage.setItem('ficha-atual', id); } catch (e) {}
}
// ficha nova só vai para o banco no primeiro preenchimento (abrir uma conversa não cria ficha vazia)
function nova(base) {
  if (dirty) salvar();
  const id = base && base.id || ('f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
  ficha = { id, nome: '', contato: '', status: 'rascunho', nova: true, dados: { canais: { feriadosNacionais: true } }, ...(base || {}) };
  ficha.dados = ficha.dados || {}; atualId = id; etapaId = 'empresa'; desenharTudo();
  if (ficha.nome) { dirty = true; salvar(); } else setTimeout(() => $('#f-empresa-nome')?.focus(), 50);
}

// ── eventos ──
document.addEventListener('input', ev => {
  const el = ev.target, p = el.dataset && el.dataset.p; if (!p || !ficha) return;
  const v = el.type === 'checkbox' ? el.checked : el.dataset.linhas ? el.value.split('\n').map(s => s.trim()).filter(Boolean) : el.value;
  porCaminho(ficha.dados, p, v);
  if (p === 'empresa.nome') { ficha.nome = el.value.trim(); const f = fichas.find(x => x.id === ficha.id); if (f) f.nome = ficha.nome; desenharFichas(); }
  marcarSujo(); desenharEtapas();
});
document.addEventListener('change', ev => { if (ev.target.matches('select, input[type=checkbox], input[type=date], input[type=time]')) ev.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'novaFicha' || b.id === 'novaFicha2') return void nova();
  if (b.dataset.ficha) return abrir(b.dataset.ficha);
  if (b.dataset.etapa !== undefined && b.dataset.etapa) { if (!ficha) return; etapaId = b.dataset.etapa; desenharEtapas(); desenharPrincipal(); $('#principal').scrollIntoView({ block: 'start' }); return; }
  if (!ficha) return;
  if (b.dataset.mais) { const arr = lerCaminho(ficha.dados, b.dataset.mais); porCaminho(ficha.dados, b.dataset.mais, [...(Array.isArray(arr) ? arr : []), {}]); marcarSujo(); desenharEtapas(); desenharPrincipal(); return; }
  if (b.dataset.tirar) { const ks = b.dataset.tirar.split('.'), i = Number(ks.pop()), arr = lerCaminho(ficha.dados, ks.join('.')) || []; arr.splice(i, 1); marcarSujo(); desenharEtapas(); desenharPrincipal(); return; }
  if (b.id === 'alternarStatus') { ficha.status = ficha.status === 'pronta' ? 'rascunho' : 'pronta'; const f = fichas.find(x => x.id === ficha.id); if (f) f.status = ficha.status; marcarSujo(); desenharFichas(); b.textContent = ficha.status === 'pronta' ? 'Voltar para rascunho' : 'Marcar como pronta'; return; }
  if (b.id === 'verJson') { const c = $('#caixaJson'); c.hidden = !c.hidden; $('#textoJson').value = JSON.stringify({ ficha: ficha.id, nome: ficha.nome, status: ficha.status, ...ficha.dados }, null, 2); if (!c.hidden) c.scrollIntoView({ block: 'nearest' }); return; }
  if (b.id === 'gerarCrm') {
    const a = arquivoCRM(ficha), txt = JSON.stringify(a, null, 2), nome = 'crm-' + slug(ficha.nome) + '.json';
    const c = $('#caixaCrm'); c.hidden = false; $('#textoCrm').value = txt;
    $('#resumoCrm').textContent = 'Formato leadvox-modelo-crm, versão 1. ' + contagem(a) + '. Usuários, horário e a parte da IA ficam na ficha.';
    c.scrollIntoView({ block: 'nearest' });
    try { const url = URL.createObjectURL(new Blob([txt], { type: 'application/json' })), a = document.createElement('a');
      a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      $('#resumoCrm').textContent += ' Baixando ' + nome + '. Se o download não começar, use Copiar.'; }
    catch (e) { $('#resumoCrm').textContent += ' Não deu para baixar aqui: use Copiar e salve como ' + nome + '.'; }
    return;
  }
  if (b.id === 'copiarCrm') { const t = $('#textoCrm'); try { navigator.clipboard.writeText(t.value).then(() => { b.textContent = 'Copiado'; setTimeout(() => (b.textContent = 'Copiar'), 1500); }, () => t.select()); } catch (e) { t.select(); } return; }
  if (b.id === 'copiarJson') { const t = $('#textoJson'); const fim = () => { b.textContent = 'Copiado'; setTimeout(() => (b.textContent = 'Copiar'), 1500); };
    try { navigator.clipboard.writeText(t.value).then(fim, () => { t.select(); }); } catch (e) { t.select(); } return; }
  if (b.id === 'excluir') { $('#zonaExcluir').innerHTML = `Excluir "${esc(ficha.nome || 'Sem nome')}" de vez? <button type="button" class="bt perigo" id="excluirSim">Excluir</button> <button type="button" class="bt" id="excluirNao">Cancelar</button>`; return; }
  if (b.id === 'excluirNao') { $('#zonaExcluir').innerHTML = '<button type="button" class="bt perigo" id="excluir">Excluir ficha</button>'; return; }
  if (b.id === 'excluirSim') { const id = ficha.id, eraNova = ficha.nova; clearTimeout(timer); dirty = false;
    const apagar = () => { fichas = fichas.filter(f => f.id !== id); ficha = null; atualId = null; try { localStorage.removeItem('ficha-atual'); } catch (e) {} desenharTudo(); };
    if (eraNova) { apagar(); return; }
    b.disabled = true; api('excluir', { id }).then(apagar).catch(e => { b.disabled = false; $('#zonaExcluir').insertAdjacentHTML('beforeend', ' <span class="aviso">Não excluiu (' + esc(e.code || 'erro') + ').</span>'); }); return; }
});
window.addEventListener('pagehide', () => { if (dirty) salvar(); });

// ── conversa aberta na LeadVox (o plugin recebe o ticket por mensagem) ──
function campoContato(c, nomes) {
  const cf = c && (c.customFields || c.extraInfo); if (!cf) return '';
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const alvos = nomes.map(norm);
  if (Array.isArray(cf)) { const it = cf.find(x => x && alvos.includes(norm(x.name || x.key || '')) && x.value); return it ? String(it.value) : ''; }
  for (const k in cf) if (alvos.includes(norm(k)) && cf[k]) return String(cf[k]);
  return '';
}
let contatoAtual = null, listaPronta = false;
function aplicarTicket(t) {
  const c = (t && t.contact) || {}, numero = String(c.number || '').replace(/\D/g, '');
  if (!numero || (contatoAtual && contatoAtual.numero === numero)) return;
  contatoAtual = { numero, nome: c.name || c.pushname || '', id: 'c-' + numero };
  const empresa = campoContato(c, ['Nome Empresa.:', 'Nome Empresa', 'Empresa']) || c.company || '';
  const box = $('#contatoConversa'); box.hidden = false;
  box.innerHTML = `<span class="rot">Conversa aberta</span><b>${esc(contatoAtual.nome || 'Contato')}</b><span>${esc(numero)}${empresa ? ' · ' + esc(empresa) : ''}</span>`;
  const abrirDoContato = () => {
    if (fichas.some(f => f.id === contatoAtual.id)) { abrir(contatoAtual.id); return; }
    nova({ id: contatoAtual.id, contato: numero, nome: empresa, dados: { canais: { feriadosNacionais: true },
      empresa: { nome: empresa, respNome: contatoAtual.nome, respWhats: numero, respEmail: c.email || campoContato(c, ['E-mail.:', 'E-mail', 'Email']),
        instagram: campoContato(c, ['Instagram']), cidade: campoContato(c, ['Praça/UF', 'Cidade']) } } });
  };
  if (listaPronta) abrirDoContato(); else contatoAtual.pendente = abrirDoContato;
}
window.addEventListener('message', ev => {
  if (!CFG.ORIGENS.includes(ev.origin)) return;
  let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
  if (m && m.type === 'DEFAULT_DATA' && m.data && m.data.ticket) aplicarTicket(m.data.ticket);
});

// ── início ──
desenharTudo();
(async () => {
  if (!CFG.KEY) { desenharFichas('Falta a chave do plugin. Abra pelo link completo cadastrado na LeadVox (com ?k= no fim).'); return; }
  try { fichas = (await api('listar')).fichas || []; }
  catch (e) { desenharFichas(e.code === 'chave' ? 'A chave do plugin não confere. Confira o link cadastrado na LeadVox.' : 'Não deu para carregar as fichas (' + (e.code || 'erro') + '). Recarregue o plugin.'); return; }
  listaPronta = true; desenharFichas();
  if (contatoAtual && contatoAtual.pendente) { contatoAtual.pendente(); return; }
  let ult = null; try { ult = localStorage.getItem('ficha-atual'); } catch (e) {}
  if (ult && fichas.some(f => f.id === ult)) abrir(ult);
})();
})();
</script>
