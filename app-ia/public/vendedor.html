<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LeadVox · Plugin do Vendedor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lv.css">
<style>
  /* Plugin na lateral da LeadVox: coluna estreita, tudo empilhado */
  body { font-size: 14px; }
  .pv { padding: 12px 12px 40px; max-width: 520px; margin: 0 auto; }
  .pv-topo { display: flex; align-items: center; gap: 10px; }
  .pv-topo img { width: 92px; height: auto; }
  .pv-topo small { color: var(--suave); }
  .pv-cli { margin-top: 10px; padding: 10px 12px; background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; }
  .pv-cli b { display: block; font-size: 15px; }
  .pv-cli small { display: block; color: var(--suave); }
  .pv .abas { padding-top: 10px; }
  .pv .card { margin-top: 10px; padding: 12px; }
  .pv h3 { font-size: 14px; }
  .pv .st-ia { display: flex; align-items: flex-start; gap: 10px; }
  .pv .st-ia i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; margin-top: 5px; background: var(--suave); }
  .pv .st-ia i.on { background: var(--verde); } .pv .st-ia i.pausa { background: var(--amarelo); } .pv .st-ia i.off { background: var(--erro); }
  .pv .bt-largo { width: 100%; margin-top: 10px; }
  .pv ul { margin: 6px 0 0; padding-left: 18px; }
  .pv li { margin: 3px 0; }
  .pv .msg { white-space: pre-wrap; background: var(--navy); border: 1px solid var(--linha); border-radius: var(--raio); padding: 10px; margin-top: 6px; }
  .pv .linha2 { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pv .vazio-pv { text-align: center; padding: 30px 10px; color: var(--suave); }
  .pv .breve { opacity: .55; }
  /* painelzinho do cliente: números que já estão guardados, sem IA */
  .pv .nums { display: grid; gap: 8px; margin-top: 8px; }
  .pv .num { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; background: var(--navy); border: 1px solid var(--linha); border-radius: var(--raio); }
  .pv .num > span { font-size: 16px; line-height: 20px; }
  .pv .num b { display: block; font-size: 13px; }
  .pv .num small { display: block; color: var(--suave); font-size: 12px; }
  .pv .num.alerta-num { border-color: var(--amarelo); }
  .pv .atalhos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pv .atalhos button { padding: 4px 10px; font-size: 12px; }
  .pv textarea { min-height: 60px; }
  /* aba Estoque: para quem vai, busca, filtros e o cartão do veículo com Ficha / Fotos / Vídeo */
  .pv .es-para { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; }
  .pv .es-av { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--navy); background: var(--verde); }
  .pv .es-para > div { min-width: 0; flex: 1; }
  .pv .es-para small { display: block; color: var(--suave); font-size: 11px; }
  .pv .es-para b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv .es-marca { font-weight: 700; font-size: 12px; white-space: nowrap; } .pv .es-marca em { font-style: normal; color: var(--verde); }
  .pv .es-busca { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 0 12px; background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; }
  .pv .es-busca input { border: 0; background: transparent; padding: 11px 0; box-shadow: none; }
  .pv .es-chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .pv .es-chips button { border-radius: 999px; padding: 6px 14px; font-size: 13px; white-space: nowrap; }
  .pv .es-chips button[aria-pressed="true"] { background: var(--verde); color: var(--navy); border-color: var(--verde); font-weight: 700; }
  .pv .es-total { font-size: 13px; margin: 10px 0 0; }
  .pv .pv-veic { margin-top: 10px; padding: 0; overflow: hidden; }
  .pv .pv-veic-topo { display: grid; grid-template-columns: 112px 1fr; gap: 10px; padding: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 0; color: inherit; font: inherit; cursor: pointer; }
  .pv .pv-veic-topo:hover { background: rgba(255,255,255,.02); }
  .pv .pv-veic-info { display: block; min-width: 0; }
  .pv .pv-veic-foto svg { width: 34px; height: 34px; color: var(--suave); }
  .pv .pv-veic-preco em { font-style: normal; color: var(--suave); font-size: 12px; }
  .pv .pv-veic-acoes button { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .pv .pv-veic-acoes svg { width: 15px; height: 15px; color: var(--verde); flex: none; }
  .pv .es-esq { height: 140px; border-radius: 12px; margin-top: 10px; background: linear-gradient(90deg, var(--painel) 0, rgba(255,255,255,.05) 40%, var(--painel) 80%); background-size: 300% 100%; animation: es-brilho 1.3s linear infinite; }
  @keyframes es-brilho { to { background-position: -100% 0; } }
  .pv .es-aviso { margin-top: 10px; border: 1px dashed var(--linha); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--suave); }
  .pv .es-aviso strong { display: block; color: inherit; font-size: 15px; margin-bottom: 4px; color: #fff; }
  .pv .es-aviso button { margin-top: 12px; }
  /* folha que sobe: detalhe do veículo e "vai chegar assim" */
  .fundo { position: fixed; inset: 0; background: rgba(3,6,14,.6); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 20; }
  .fundo.on { opacity: 1; pointer-events: auto; }
  .folha { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column; background: var(--painel); border-top: 1px solid var(--linha); border-radius: 16px 16px 0 0; transform: translateY(102%); transition: transform .22s ease-out; z-index: 21; max-width: 520px; margin: 0 auto; }
  .folha.on { transform: none; }
  @media (prefers-reduced-motion: reduce) { .folha, .fundo { transition: none; } }
  .folha-topo { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
  .folha-topo h2 { flex: 1; font-size: 16px; line-height: 1.25; margin: 0; }
  .fechar { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .fechar svg { width: 16px; height: 16px; }
  .folha-meio { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
  .folha-pe { flex: none; display: flex; gap: 8px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--linha); }
  .folha .btn { flex: 1; min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; }
  .folha .btn.principal { background: var(--verde); border-color: var(--verde); color: var(--navy); }
  .folha .btn:disabled { opacity: .45; cursor: not-allowed; }
  .folha .btn svg { width: 16px; height: 16px; }
  .galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .foto { position: relative; aspect-ratio: 4/3; padding: 0; border-radius: 8px; overflow: hidden; background: var(--navy); border: 2px solid transparent; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto[aria-pressed="true"] { border-color: var(--verde); }
  .foto .marcar { position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(7,13,28,.75); border: 2px solid #fff; display: grid; place-items: center; }
  .foto[aria-pressed="true"] .marcar { background: var(--verde); border-color: var(--verde); }
  .foto .marcar svg { width: 11px; height: 11px; color: var(--navy); opacity: 0; }
  .foto[aria-pressed="true"] .marcar svg { opacity: 1; }
  .foto .num { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: rgba(7,13,28,.75); padding: 1px 5px; border-radius: 4px; color: #fff; }
  .sel { display: flex; justify-content: space-between; align-items: center; color: var(--suave); font-size: 12px; margin: 2px 0 8px; }
  .sel button { color: var(--verde); font-weight: 700; font-size: 12px; background: none; border: 0; padding: 0; }
  .secao { margin-top: 16px; }
  .secao h3 { font-size: 13px; color: var(--suave); margin: 0 0 6px; }
  .ficha-l { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--linha); font-size: 13px; }
  .ficha-l span:first-child { color: var(--suave); }
  .ficha-l span:last-child { text-align: right; font-weight: 500; }
  .ops { display: flex; flex-wrap: wrap; gap: 5px; }
  .ops span { background: var(--navy); border-radius: 5px; padding: 3px 7px; font-size: 12px; }
  .obs { white-space: pre-line; font-size: 13px; color: #c9d2e6; }
  .video-box { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--linha); border-radius: 10px; font-size: 13px; }
  .video-box svg { width: 22px; height: 22px; color: var(--verde); flex: none; }
  .previa-rot { color: var(--suave); font-size: 12px; margin: 0 0 6px; }
  .anexo { display: flex; align-items: center; gap: 8px; background: var(--navy); border: 1px solid var(--linha); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 8px 10px; font-size: 12.5px; font-weight: 500; }
  .anexo img { width: 44px; height: 33px; object-fit: cover; border-radius: 5px; }
  .anexo svg { width: 18px; height: 18px; color: var(--verde); }
  textarea.texto { width: 100%; min-height: 150px; resize: vertical; background: var(--navy); border: 1px solid var(--linha); border-radius: 0 0 10px 10px; padding: 10px; font-size: 13px; line-height: 1.5; margin: 0; }
  textarea.texto:focus { outline: none; border-color: var(--verde); }
  .opcao { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; cursor: pointer; }
  .opcao input { width: 18px; height: 18px; accent-color: var(--verde); margin: 0; }
  .folha .dica { color: var(--suave); font-size: 12px; margin-top: 8px; background: none; border: 0; padding: 0; }
  .progresso { height: 4px; border-radius: 2px; background: var(--linha); overflow: hidden; margin-top: 12px; }
  .toast { z-index: 30; }
  /* aba Proposta (convite para test drive) */
  .pv .pr-duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pv .pr-duas > div { min-width: 0; }
  .pv .pr-extras { flex-wrap: wrap; overflow: visible; }
  .pv .pr-acoes { display: grid; gap: 8px; margin-top: 10px; }
  .pv .pr-veic { display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center; }
  .pv .pr-veic img, .pv .pr-veic .sem { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--navy); display: grid; place-items: center; }
  .pv .pr-veic b { display: block; font-size: 13px; line-height: 1.3; }
  .pv .pr-veic strong { color: var(--verde); }
  .pv .pr-busca-lista button { display: flex; width: 100%; gap: 8px; align-items: center; text-align: left; padding: 6px; margin-top: 6px; background: var(--navy); }
  .pv .pr-busca-lista img { width: 48px; height: 36px; object-fit: cover; border-radius: 5px; flex: none; }
  .pv .pr-busca-lista span { font-size: 12.5px; line-height: 1.3; }
  .progresso i { display: block; height: 100%; width: 0; background: var(--verde); transition: width .4s; }
  .pv .pv-veic-foto { position: relative; width: 112px; height: 84px; border-radius: 8px; overflow: hidden; background: var(--navy); border: 1px solid var(--linha); display: grid; place-items: center; font-size: 26px; }
  .pv .pv-veic-foto img { width: 100%; height: 100%; object-fit: cover; }
  .pv .pv-veic-foto span { position: absolute; right: 4px; bottom: 4px; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.65); color: #fff; }
  .pv .pv-veic b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.3; text-transform: uppercase; }
  .pv .pv-veic small { display: block; color: var(--suave); font-size: 12px; margin-top: 3px; }
  .pv .pv-veic-preco { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .pv .pv-veic-preco strong { color: var(--verde); font-size: 15px; }
  .pv .selo { font-size: 11px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--linha); color: var(--suave); }
  .pv .selo.dest { color: var(--verde); border-color: rgba(43,232,123,.4); background: var(--verde-fundo); }
  .pv .pv-veic-acoes { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--linha); }
  .pv .pv-veic-acoes button { border: 0; border-radius: 0; background: transparent; padding: 10px 4px; font-size: 13px; font-weight: 600; }
  .pv .pv-veic-acoes button + button { border-left: 1px solid var(--linha); }
  .pv .pv-veic-acoes button:hover:not(:disabled) { background: var(--verde-fundo); }
  .pv .pv-veic-acoes button:disabled { opacity: .4; }
  .pv .pv-veic-acoes button.feito { color: var(--verde); }
</style>
</head>
<body>
<main class="pv">
  <div class="pv-topo"><img src="/logo-leadvox.png" alt="LeadVox" width="92" height="28"><small>Plugin do Vendedor</small></div>
  <div id="pvAviso" class="alerta" hidden></div>
  <div id="pvCliente" class="pv-cli" hidden></div>
  <nav class="abas" id="pvAbas" aria-label="Plugin">
    <button type="button" data-aba="ia" aria-pressed="true">🤖 IA</button>
    <button type="button" data-aba="estoque">🚗 Estoque</button>
    <button type="button" data-aba="proposta">📄 Proposta</button>
  </nav>
  <section id="abaIa">
    <div class="card" id="pvSituacao"><p class="muted">Abra um atendimento na LeadVox para ver a IA deste cliente.</p></div>
    <div class="card" id="pvPainel" hidden></div>
    <div class="card" id="pvAgendar" hidden></div>
    <div class="card" id="pvResumo" hidden></div>
  </section>
  <section id="abaEstoque" hidden>
    <div class="es-para"><span class="es-av" id="esAv" aria-hidden="true">?</span><div><small>Enviando para</small><b id="esPara">—</b></div><span class="es-marca">Estoque <em>LeadVox</em></span></div>
    <form class="es-busca" id="esBusca" role="search">
      <span aria-hidden="true">🔍</span><input id="esTermo" type="search" maxlength="60" placeholder="Buscar veículo" aria-label="Buscar veículo no estoque">
    </form>
    <div class="es-chips" role="group" aria-label="Filtrar estoque">
      <button type="button" data-f="todos" aria-pressed="true">Todos</button><button type="button" data-f="destaque" aria-pressed="false">Destaques</button>
      <button type="button" data-f="carro" aria-pressed="false">Carros</button><button type="button" data-f="moto" aria-pressed="false">Motos</button>
    </div>
    <p class="muted es-total" id="esTotal" aria-live="polite"></p>
    <div id="esLista"></div>
  </section>
  <section id="abaProposta" hidden>
    <div class="card">
      <h3>📄 Convite para test drive</h3>
      <p class="muted" style="font-size:13px;margin-top:4px">Um PDF com a cara da loja: foto e ficha do veículo, as condições que você preparar e o convite para o cliente vir à loja.</p>
    </div>
    <div class="card" id="prVeiculo"></div>
    <form id="prForm" hidden>
      <div class="card">
        <h3>Pagamento</h3>
        <div class="es-chips pr-extras" role="group" aria-label="Forma de pagamento" id="prFormas">
          <button type="button" data-forma="" aria-pressed="true">Não informar</button><button type="button" data-forma="avista" aria-pressed="false">À vista</button>
          <button type="button" data-forma="financiado" aria-pressed="false">Financiamento</button><button type="button" data-forma="consorcio" aria-pressed="false">Consórcio</button><button type="button" data-forma="cartao" aria-pressed="false">Cartão</button>
        </div>
        <div id="prParcelado" hidden>
          <div class="pr-duas"><div><label for="prEntrada">Entrada (R$)</label><input id="prEntrada" inputmode="decimal" placeholder="30.000"></div>
            <div><label for="prBanco">Banco / administradora</label><input id="prBanco" maxlength="60"></div></div>
          <div class="pr-duas"><div><label for="prParcelas">Parcelas</label><input id="prParcelas" inputmode="numeric" placeholder="48"></div>
            <div><label for="prValorParcela">Valor da parcela (R$)</label><input id="prValorParcela" inputmode="decimal" placeholder="1.890,00"></div></div>
        </div>
      </div>
      <div class="card">
        <label class="opcao" style="margin:0"><input type="checkbox" id="prTemTroca"> <b>Cliente tem veículo na troca</b></label>
        <div id="prTroca" hidden>
          <label for="prTrocaModelo">Veículo do cliente</label><input id="prTrocaModelo" maxlength="80" placeholder="Ex.: Chevrolet Onix LT">
          <div class="pr-duas"><div><label for="prTrocaAno">Ano</label><input id="prTrocaAno" maxlength="12" placeholder="2019"></div>
            <div><label for="prTrocaKm">Km</label><input id="prTrocaKm" inputmode="numeric" placeholder="60.000"></div></div>
          <label for="prTrocaValor">Avaliação (R$) <small>(opcional)</small></label><input id="prTrocaValor" inputmode="decimal">
        </div>
      </div>
      <div class="card">
        <h3>Incluso</h3>
        <div class="es-chips pr-extras" role="group" aria-label="O que está incluso" id="prExtras"></div>
        <div class="es-busca" style="margin-top:8px"><input id="prExtraNovo" maxlength="80" placeholder="Outro item (ex.: película de brinde)" aria-label="Outro item incluso"><button type="button" class="sm" id="prExtraAdd">Adicionar</button></div>
      </div>
      <div class="card">
        <div class="pr-duas"><div><label for="prValidade">Válido por</label><select id="prValidade"><option value="3">3 dias</option><option value="7" selected>7 dias</option><option value="15">15 dias</option><option value="30">30 dias</option></select></div>
          <div><label for="prSugestao">Sugestão de horário</label><input id="prSugestao" maxlength="80" placeholder="Ex.: sábado, 10h"></div></div>
        <label for="prObs">Observações <small>(opcional)</small></label><textarea id="prObs" maxlength="500" placeholder="Ex.: taxa especial para aprovação até sábado"></textarea>
        <label for="prMensagem">Mensagem que vai junto do PDF</label><textarea id="prMensagem" maxlength="1000"></textarea>
      </div>
      <div class="pr-acoes">
        <button type="button" class="bt-largo" id="prPrevia">👁️ Ver o PDF antes</button>
        <button type="submit" class="principal bt-largo" id="prEnviar">📤 Enviar convite ao cliente</button>
      </div>
    </form>
  </section>
</main>
<div class="fundo" id="fundo"></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo" aria-hidden="true">
  <div class="folha-topo">
    <h2 id="folhaTitulo"></h2>
    <button class="fechar" type="button" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="folha-meio" id="folhaMeio"></div>
  <div class="folha-pe" id="folhaPe"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/vendedor.js"></script>
</body>
</html>
